[package]
name = "cats-metrics"
version.workspace = true
edition.workspace = true

[dependencies]
cats-core = { path = "../cats-core" }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sysinfo = { version = "0.38", default-features = false, features = ["system", "network", "disk"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString", "CFNumber"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "ps"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }

[dev-dependencies]
tempfile = "3"
