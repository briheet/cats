name: Cats
options:
  bundleIdPrefix: dev.cats
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cats:
    type: application
    platform: macOS
    sources:
      - CatsApp
      - Shared
    dependencies:
      - target: CatsWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cats.app
        CODE_SIGN_ENTITLEMENTS: CatsApp/Cats.entitlements
        ENABLE_APP_SANDBOX: NO
    info:
      path: CatsApp/Info.plist
      properties:
        CFBundleDisplayName: Cats
        LSUIElement: true
        NSHumanReadableCopyright: Cats
        CFBundleURLTypes:
          - CFBundleURLName: dev.cats.app
            CFBundleURLSchemes: [cats]
    postBuildScripts:
      - name: Embed Rust collector
        script: |
          set -eu
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          cp "${SRCROOT}/../target/release/cats" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/cats"
        basedOnDependencyAnalysis: false
  CatsWidget:
    type: app-extension
    platform: macOS
    sources:
      - CatsWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cats.app.widget
        CODE_SIGN_ENTITLEMENTS: CatsWidget/CatsWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: CatsWidget/Info.plist
      properties:
        CFBundleDisplayName: Cats
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Cats:
    build:
      targets:
        Cats: all

