name: Signed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag, for example v0.1.0
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        env:
          CERT: ${{ secrets.CATS_CERTIFICATE_P12 }}
          PASSWORD: ${{ secrets.CATS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.CATS_SIGN_IDENTITY }}
          TEAM: ${{ secrets.CATS_TEAM_ID }}
          APPLE_ID: ${{ secrets.CATS_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.CATS_APPLE_APP_PASSWORD }}
        run: |
          for key in CERT PASSWORD IDENTITY TEAM APPLE_ID NOTARY_PASSWORD; do
            test -n "${!key}" || { echo "Missing signing configuration: $key"; exit 1; }
          done
      - uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.CATS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CATS_CERTIFICATE_PASSWORD }}
      - run: rustup update stable --no-self-update
      - run: brew install just xcodegen
      - run: just check && just test
      - name: Sign and notarize
        env:
          CATS_SIGN_IDENTITY: ${{ secrets.CATS_SIGN_IDENTITY }}
          CATS_TEAM_ID: ${{ secrets.CATS_TEAM_ID }}
          CATS_NOTARY_PROFILE: cats-release
          APPLE_ID: ${{ secrets.CATS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.CATS_APPLE_APP_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag }}
          CATS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export CATS_VERSION="${RELEASE_TAG#v}"
          xcrun notarytool store-credentials "$CATS_NOTARY_PROFILE" --apple-id "$APPLE_ID" --team-id "$CATS_TEAM_ID" --password "$APPLE_PASSWORD"
          bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cats-release-${{ runner.arch }}
          path: build/Cats-*.zip
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cats-release-*
          merge-multiple: true
          path: release
      - name: Publish signed bundles and Nix manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CATS_TEAM_ID: ${{ secrets.CATS_TEAM_ID }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ruby scripts/release-manifest.rb "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$CATS_TEAM_ID" release > nix/releases.json
          gh release create "$RELEASE_TAG" release/Cats-*.zip nix/releases.json --target "$GITHUB_SHA" --title "Cats $RELEASE_TAG" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: nix-release-manifest
          path: nix/releases.json
