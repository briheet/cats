name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: brew install just
      - run: cargo fmt --all -- --check && cargo clippy --all-targets -- -D warnings
      - run: just test && just build
      - run: just smoke
      - uses: actions/upload-artifact@v4
        with:
          name: cats-development-${{ runner.arch }}
          path: build/smoke-report.json
  nix:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - run: nix flake check
